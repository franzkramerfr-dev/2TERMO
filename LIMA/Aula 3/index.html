<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="IMAGENS/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="terraco.css" />

    <title>FAVICONS e IMAGENS</title>
  </head>
  <body>
    <div class="titulo">
      <h1>Imagens do Google</h1>
      <div class="imagem">
        <h2>Terraço Itália</h2>
        <img
          src="terraco.jpg"
          alt="Terraço Itália"
          title="Restaurante - São Paulo"
          align="center"
        />
      </div>
    </div>
  <div class = name>
    <h2>Terraço Itália - Restaurante em São Paulo</h2>
  </div>
    
    <div>
      <img
        src="IMAGENS/an.jpg"
        alt="Terraço Itália"
        title="Terraço Itália"
        width="800px"
        height="600px"
      />
    </div>

    <h2>Terraço Itália - São Paulo</h2>
    <div>
      <img
        src="terraco.jpg"
        alt="Terraço Itália"
        title="Restaurante Terraço Itália"
        style="
          margin: 20px;
          position: fixed;
          background-image: url(&quot;IMAGENS/background.jpg&quot;);
          background-repeat: repeat;
        "
      />
    </div>
  </body>
</html>
