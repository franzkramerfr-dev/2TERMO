<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <title>Carousel</title>
  </head>
  <body class="bg-black">
    <h1 class="bg-success m-4 p-4 text-white">Personagens</h1>
    <section
      id="Carousel-Personagens"
      class="carousel slide"
      data-bs-ride="carousel"
    >
      <article class="carousel-inner m-4 p-4">
        <aside class="carousel-item-active" data-bs-interval="200">
          <img
            src="https://static.wikia.nocookie.net/dublagem/images/8/88/ChavesAnimadoPoster.jpg/revision/latest?cb=20250326142111&path-prefix=pt-br"
            alt="Woddy"
          />
        </aside>
        <aside class="carousel-item" data-bs-interval="200">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRXSJv8q5VrKqFYE5LrffWEJaqrPNK99kukvNKztGU4Ds1heuyJ1ce-763b&s=10"
            class="d-block w-100"
            alt="Buzz"
          />
        </aside>
        <aside class="carousel-item" data-bs-interval="200">
          <img
            src="https://static.wikia.nocookie.net/chavesemdesenhoanimado/images/9/9a/Chanimadodonramon.jpg/revision/latest/scale-to-width-down/350?cb=20131031022422&path-prefix=pt-br"
            class="d-block w-100"
            alt="Cabeça de Batata"
          />
        </aside>
      </article>
    </section>

    <h2>Badges</h2>
    <p>Woody <span class="badge text-bg-sucess">Xerife</span></p>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
